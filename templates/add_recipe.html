<!DOCTYPE html>
<html>

<head>
  <title>Lisää resepti</title>
</head>

<body>
  <p>
    <a href="/">Etusivulle</a> <a href="/recipes">Resepteihin</a>
  </p>
  <form action="/send" method="post">
    <p>
      Reseptin nimi: <br />
      <textarea name="dish_name" rows="3" cols="40"></textarea>
    </p> 
    <p>Ruokalaji:</p>
    <p>
        <input type="radio" name="dish_type" value="Alkuruoka" /> Alkuruoka
        <input type="radio" name="dish_type" value="Pääruoka" /> Pääruoka
        <input type="radio" name="dish_type" value="Jälkiruoka" /> Jälkiruoka
    </p>
    <p>Ruokavalio:</p>
    <p>
      <input type="checkbox" name="diet" value="Gluteeniton" /> Gluteeniton
      <input type="checkbox" name="diet" value="Laktoositon" /> Laktoositon
      <input type="checkbox" name="diet" value="Vegaaninen" /> Vegaaninen
    </p>
    <p>
      Ainesosat: <br />
      <textarea name="ingredients" rows="3" cols="40"></textarea>
    </p> 
    <p>
      Kommentti: <br />
      <textarea name="comment" rows="3" cols="40"></textarea>
    </p>
    <p>Arvosana:</p>
    <p>
        <input type="radio" name="grade" value="1" /> 1
        <input type="radio" name="grade" value="2" /> 2
        <input type="radio" name="grade" value="3" /> 3
        <input type="radio" name="grade" value="4" /> 4
        <input type="radio" name="grade" value="5" /> 5
    </p>
    <p>
      <input type="submit" value="Lähetä" />
    </p>
  </form>
</body>
